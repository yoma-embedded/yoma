[workspace]
resolver = "2"
members = [
    "crates/ir",
    "crates/importer",
    "crates/engine",
    "crates/codegen",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/stm32-config-kernel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
quick-xml = "0.37"
roxmltree = "0.20"
anyhow = "1"
thiserror = "2"
num-rational = "0.4"
clap = { version = "4", features = ["derive"] }
schemars = "1"
minijinja = "2"
insta = { version = "1", features = ["json"] }
walkdir = "2"

[profile.release]
lto = true
