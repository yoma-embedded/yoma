[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "controller_map"
version = "0.1.0"
description = "Extract main-controller pin connections from a KiCad or Altium netlist/PDF"
requires-python = ">3.13"
dependencies = ["pypdf>=6.10,<7"]

[tool.setuptools]
packages = ["controller_map"]

[project.scripts]
controller_map = "controller_map.controller_map:main"
connections = "controller_map.connections:main"
board_ir = "controller_map.board_ir:main"
