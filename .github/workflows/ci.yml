name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# 干净克隆后的闸门分两半,入口必须和本地同一条:
#   check    —— Ubuntu: typecheck + `bun run test`(根上唯一全量单测入口,不是裸 bun test)
#   desktop  —— Windows(主支持平台): 进程树清理回归 + 生产构建 + 引擎 + smoke + 关键 Electron E2E
# 裸 `bun test` 会扫到 vitest / DOM / 平台专用文件,红一片是跑法不对。

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查
        run: bun typecheck
      - name: 单测
        run: bun run test

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装依赖
        run: bun install --frozen-lockfile
      # Windows 是主支持平台,但内核单测里能在这里跑绿的只有 agent(185)与 kernel(94)两包(2026-08-21 核过)。
      # coding-agent 有 46 个用例的夹具写死 /bin/echo 与 .sh 脚本、bench 有 5 个依赖 POSIX shell,
      # 它们在 Windows 上红是跑法问题不是代码问题 —— 把夹具改成跨平台之前别把它们加进来。
      - name: 内核单测(agent + kernel,Windows 岗)
        run: bun test packages/agent && bun --cwd packages/kernel test
      - name: 下载 Electron 二进制
        shell: pwsh
        run: |
          if (Test-Path packages/desktop/node_modules/electron/install.js) {
            node packages/desktop/node_modules/electron/install.js
          } elseif (Test-Path node_modules/electron/install.js) {
            node node_modules/electron/install.js
          } else {
            throw "electron install.js not found after bun install"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engines/stm32-config-kernel
      - uses: astral-sh/setup-uv@v5
      # irpack 是 CubeMX 解析产物,不进 git。没 CubeMX 的 runner 上 build.ts 跳过导入,
      # smoke 跳过 STM32 配置闸门;网表引擎和内核其它工具照验。
      - name: 构建引擎
        run: bun engines/build.ts
      - name: 生产构建
        run: bun build:desktop
      - name: 内核冒烟
        run: bun --cwd packages/desktop smoke
      - name: 内核 IPC 端到端
        run: bun --cwd packages/desktop e2e:ipc
      - name: renderer contextBridge 端到端
        run: bun --cwd packages/desktop e2e:renderer
