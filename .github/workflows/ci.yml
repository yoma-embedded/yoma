name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# 干净克隆后的闸门分两半,入口必须和本地同一条:
#   check    —— Ubuntu: typecheck + `bun run test`(根上唯一全量单测入口,不是裸 bun test)
#   desktop  —— Windows(主支持平台): 进程树清理回归 + 生产构建 + 引擎 + smoke + 关键 Electron E2E
# 裸 `bun test` 会扫到 vitest / DOM / 平台专用文件,红一片是跑法不对。

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查
        run: bun typecheck
      - name: 单测
        run: bun run test

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # bun 在 Windows runner 上偶发 "EBUSY: failed to link binaries for package: …"(2026-09-06 撞过一次,
      # 同一提交重跑即绿):刚写下的文件被 Defender 扫描攥着句柄。重试一次比整轮红了再手点重跑便宜。
      - name: 安装依赖
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::bun install 失败(多半是 Windows 上的 EBUSY 抖动),重试一次"
            bun install --frozen-lockfile
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Windows 是主支持平台。agent(185)与 kernel(94)一直在这里跑;coding-agent 从前有 46 个用例的夹具
      # 写死 /bin/echo 与 .sh 脚本,2026-09-06 把夹具改成 JS + 按平台启动器(test/fixtures/fake-exe.ts)
      # 之后整包在 Windows 上全绿(854 过 / 44 跳过),加进来 —— 这是唯一能抓住"只在 Windows 上卡死"
      # 这类回归的岗(scope 驱动 unref 定时器那次就是它没跑才漏的)。
      # bench 还有 5 个依赖 POSIX shell 的 mailbox 用例(路径断言、autocrlf、5 s 超时),先不加。
      # desktop 的单测(更新器状态机、信箱控制器等)是纯 Node 逻辑,Windows 上照跑。
      - name: 内核单测(agent + kernel + coding-agent + desktop,Windows 岗)
        run: bun test packages/agent && bun --cwd packages/kernel test && bun --cwd packages/coding-agent test && bun --cwd packages/desktop test
      - name: 下载 Electron 二进制
        shell: pwsh
        run: |
          if (Test-Path packages/desktop/node_modules/electron/install.js) {
            node packages/desktop/node_modules/electron/install.js
          } elseif (Test-Path node_modules/electron/install.js) {
            node node_modules/electron/install.js
          } else {
            throw "electron install.js not found after bun install"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engines/stm32-config-kernel
      - uses: astral-sh/setup-uv@v5
      # irpack 是 CubeMX 解析产物,不进 git。没 CubeMX 的 runner 上 build.ts 跳过导入,
      # smoke 跳过 STM32 配置闸门;网表引擎和内核其它工具照验。
      - name: 构建引擎
        run: bun engines/build.ts
      - name: 生产构建
        run: bun build:desktop
      - name: 内核冒烟
        run: bun --cwd packages/desktop smoke
      - name: 内核 IPC 端到端
        run: bun --cwd packages/desktop e2e:ipc
      - name: renderer contextBridge 端到端
        run: bun --cwd packages/desktop e2e:renderer
