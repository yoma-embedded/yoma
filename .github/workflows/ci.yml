name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: 上游完整性、类型检查、全量单测
        run: npm run check:ci

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run engines:rg
      - name: Windows 内核回归
        run: npm run test:windows
      - run: npm run build:desktop
      # npm ci 的 postinstall 已下载 Electron。引擎编译和完整冒烟由 engines / desktop-win 负责。
      - run: npm run e2e:ipc -w packages/desktop
      - run: npm run e2e:renderer -w packages/desktop
      - run: npm run e2e:paint -w packages/desktop
