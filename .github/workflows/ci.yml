name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# 干净克隆后的闸门分两半,入口必须和本地同一条:
#   check    —— Ubuntu: typecheck + `npm test`(vitest 全量)
#   desktop  —— Windows(主支持平台): 进程树清理回归 + 生产构建 + 引擎 + smoke + 关键 Electron E2E

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单测
        run: npm test

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci
      # Windows 是主支持平台。agent(185)与 kernel(94)一直在这里跑;coding-agent 从前有 46 个用例的夹具
      # 写死 /bin/echo 与 .sh 脚本,2026-09-06 把夹具改成 JS + 按平台启动器(test/fixtures/fake-exe.ts)
      # 之后整包在 Windows 上全绿(854 过 / 44 跳过),加进来 —— 这是唯一能抓住"只在 Windows 上卡死"
      # 这类回归的岗(scope 驱动 unref 定时器那次就是它没跑才漏的)。
      # bench 还有 5 个依赖 POSIX shell 的 mailbox 用例(路径断言、autocrlf、5 s 超时),先不加。
      # desktop 的单测(更新器状态机、信箱控制器等)是纯 Node 逻辑,Windows 上照跑。
      - name: 内核单测(agent + kernel + coding-agent + desktop,Windows 岗)
        run: npx vitest run --project agent --project kernel --project coding-agent --project desktop
      - name: 下载 Electron 二进制
        shell: pwsh
        run: |
          if (Test-Path packages/desktop/node_modules/electron/install.js) {
            node packages/desktop/node_modules/electron/install.js
          } elseif (Test-Path node_modules/electron/install.js) {
            node node_modules/electron/install.js
          } else {
            throw "electron install.js not found after npm ci"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engines/stm32-config-kernel
      - uses: astral-sh/setup-uv@v5
      # irpack 是 CubeMX 解析产物,不进 git。没 CubeMX 的 runner 上 build.ts 跳过导入,
      # smoke 跳过 STM32 配置闸门;网表引擎和内核其它工具照验。
      - name: 构建引擎
        run: npm run engines:build
      - name: 生产构建
        run: npm run build:desktop
      - name: 内核冒烟
        run: npm run smoke -w packages/desktop
      - name: 内核 IPC 端到端
        run: npm run e2e:ipc -w packages/desktop
      - name: renderer contextBridge 端到端
        run: npm run e2e:renderer -w packages/desktop
