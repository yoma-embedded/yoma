# 在 Windows runner 上直接出安装包(NSIS),并在版本 tag 上发布 GitHub Release。
#
#   手动触发(workflow_dispatch) → 构建并上传临时 artifact,用于验证不同渠道;
#   推送 tag `v*`               → 当场编引擎、构建 prod、验收安装包、创建正式 Release。
#
# 引擎来源:
#   tag `v*` 和 engines=build —— 当场 `bun engines/build.ts --dist`
#                               (cargo + PyInstaller + MSYS2 编 yoma-la)。
#                               不依赖另一份 engines-v* Release。
#   engines=prebuilt(仅手动触发的默认)—— 按 packages/desktop/engines.lock.json 下载。
#                               跨平台复用预编译 zip 时才用。
#
# GitHub 托管机没有 CubeMX,`--dist --allow-missing-irpacks` 仍出网表引擎;
# 安装包里没有 STM32 配置 irpack。本机有 CubeMX 时去掉该 flag 再编即可补上。
# yoma-la 在 Windows 上硬依赖 MSYS2 ucrt64 —— 漏装会直接红,不会默默少一个引擎。
#
# 产出的是**未签名**包:装的时候 SmartScreen 会拦,点「更多信息 → 仍要运行」。
# 要消除得买 Windows 代码签名证书,那是产品决定不是技术问题。

name: desktop-win

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 引擎从哪来
        type: choice
        default: prebuilt
        options: [prebuilt, build]
      channel:
        description: 渠道(决定 appId / 产品名 / 自动更新)
        type: choice
        default: prod
        options: [prod, beta, dev]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # tag 触发没有 workflow_dispatch inputs,正式发布一律当场编引擎。
      BUILD_ENGINES: ${{ github.event_name == 'push' || inputs.engines == 'build' }}
    steps:
      # 引擎源码已吸收进本仓(engines/ 是普通目录),engines=build 从源码构建
      # 不再需要私有 submodule 的 ENGINES_TOKEN。
      - uses: actions/checkout@v4

      # electron-updater 以 package.json 的版本比较新旧。tag 和包版本不一致会出现
      # "Release 叫 v0.2.0,安装后却还是 0.1.0"这种无法自动更新的坏版本,发布前响亮失败。
      - name: 校验 tag 与应用版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "tag $tag 与 packages/desktop/package.json 的版本 $version 不一致"
          }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 下载 Electron 二进制
        shell: pwsh
        run: |
          if (Test-Path packages/desktop/node_modules/electron/install.js) {
            node packages/desktop/node_modules/electron/install.js
          } elseif (Test-Path node_modules/electron/install.js) {
            node node_modules/electron/install.js
          } else {
            throw "electron install.js not found after bun install"
          }

      - uses: dtolnay/rust-toolchain@stable
        if: env.BUILD_ENGINES == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.BUILD_ENGINES == 'true'
        with:
          workspaces: |
            engines/stm32-config-kernel
      - uses: astral-sh/setup-uv@v5
        if: env.BUILD_ENGINES == 'true'

      # yoma-la 是 C 工程,Windows 上只能 MinGW。engines.yml 同一套;漏了这一步
      # `--dist` 会硬失败(C:\msys64\ucrt64\bin\gcc.exe 不存在)。
      - uses: msys2/setup-msys2@v2
        if: env.BUILD_ENGINES == 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # 当场冻结可分发引擎。托管机没有 CubeMX,允许缺 irpack,否则 --dist 会硬失败。
      # setup-msys2 装在 ${runner.temp}\msys64;build.ts 按 YOMA_LA_MSYS2 找 ucrt64。
      - name: 构建可分发引擎
        if: env.BUILD_ENGINES == 'true'
        env:
          YOMA_LA_MSYS2: ${{ format('{0}\msys64', runner.temp) }}
        run: bun engines/build.ts --dist --allow-missing-irpacks --out engines-dist

      - name: 构建 renderer / main / preload
        env:
          # tag 没有 workflow_dispatch inputs,正式发布固定走 prod。
          YOMA_CHANNEL: ${{ inputs.channel || 'prod' }}
        run: bun build:desktop

      # 当场编过就指那份 dist;否则 stage-engines 按 engines.lock.json 下载预编译产物。
      - name: 出安装包
        env:
          YOMA_CHANNEL: ${{ inputs.channel || 'prod' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOMA_ENGINES_DIR: ${{ env.BUILD_ENGINES == 'true' && format('{0}/engines-dist', github.workspace) || '' }}
        run: bun --cwd packages/desktop package:win

      - name: 检查产物里的引擎确实是 Windows 二进制
        shell: bash
        run: |
          stage=packages/desktop/.engines-stage/bin
          test -d "$stage" || { echo "::error::没有 .engines-stage/bin"; exit 1; }
          fail=0
          for f in "$stage"/*; do
            name=$(basename "$f")
            # PE 文件以 "MZ" 开头;venv 脚本以 "#!" 开头(那种拷到别人电脑必坏)
            magic=$(head -c 2 "$f" | xxd -p)
            case "$magic" in
              4d5a) echo "  ✓ $name (PE)";;
              2321) echo "::error::$name 还是 shebang 脚本,不能分发"; fail=1;;
              *)    echo "::error::$name 不是 PE 二进制(magic=$magic)"; fail=1;;
            esac
          done
          exit $fail

      # runner 是每次全新的 Windows 虚拟机。先把 NSIS 安装包静默装进临时目录,
      # 下一步再从安装后的 app.asar 启动真 preload + 真 kernel 并创建首个会话。
      - name: 在干净 Windows 上安装
        shell: pwsh
        run: |
          $installer = Resolve-Path packages/desktop/dist/yoma-win-x64.exe
          $installDir = Join-Path $env:RUNNER_TEMP "yoma-installed"
          $channel = "${{ inputs.channel || 'prod' }}"
          $productName = switch ($channel) {
            "dev" { "Yoma Dev" }
            "beta" { "Yoma Beta" }
            default { "Yoma" }
          }
          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "NSIS 安装失败,退出码 $($install.ExitCode)"
          }

          $installedExe = Join-Path $installDir "$productName.exe"
          $appAsar = Join-Path $installDir "resources/app.asar"
          $enginesDir = Join-Path $installDir "resources/engines"
          foreach ($required in @($installedExe, $appAsar, (Join-Path $enginesDir "bin"))) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "安装后缺少必需文件:$required"
            }
          }

          "YOMA_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "YOMA_DESKTOP_DIR=$appAsar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "YOMA_ENGINES_DIR=$enginesDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装产物首次会话验收
        run: bun --cwd packages/desktop e2e:renderer

      - name: 生成 Release 校验和
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dist = Resolve-Path packages/desktop/dist
          $names = @("yoma-win-x64.exe", "yoma-win-x64.exe.blockmap", "latest.yml")
          $lines = foreach ($name in $names) {
            $path = Join-Path $dist $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release 缺少必需文件:$name"
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $dist "SHA256SUMS.txt"), $lines, [Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v4
        with:
          name: yoma-win-x64-${{ inputs.channel || 'prod' }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.exe.blockmap
            packages/desktop/dist/latest.yml
            packages/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error

  # 构建任务没有写仓库权限。只有 tag 触发的这个小任务能创建 Release,
  # 并且它只能发布上一个任务已经通过安装与首次会话验收的那组文件。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yoma-win-x64-prod
          path: release

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            > [!WARNING]
            > Windows 安装包目前未做代码签名。请只从本 Release 下载、核对 `SHA256SUMS.txt`,
            > 并预期首次安装时会看到 SmartScreen 的“未知发布者”提示。
          files: |
            release/yoma-win-x64.exe
            release/yoma-win-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
